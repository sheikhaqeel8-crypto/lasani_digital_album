name: lasani_digital_album
description: "Lasani Digital Album - A4 Catalog Maker with PDF Export"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.0.7
  pdf: ^3.10.8
  printing: ^5.12.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.8.3
  share_plus: ^7.2.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  ios: false

flutter:
  uses-material-design: true
  
